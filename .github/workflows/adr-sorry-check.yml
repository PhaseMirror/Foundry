name: ADR Sorry Check

on:
  push:
    paths:
      - "ADR/**"
      - ".github/workflows/adr-sorry-check.yml"
  pull_request:
    paths:
      - "ADR/**"
      - ".github/workflows/adr-sorry-check.yml"

jobs:
  sorry-check:
    name: ADR Sorry Check (ADR-0010)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ADR Sorry Check
        run: python3 scripts/check_adr_sorry.py
