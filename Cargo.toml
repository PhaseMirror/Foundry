[workspace]
resolver = "3"
members = [
    "Foundations/Projects/ZETA-PHI-PI/rust",
    "Foundations/Projects/ALPHA_FUNCTION/rust",

    "packages/rust/edge_client",
    "packages/rust/adr-verifier",
    "packages/rust/living-loop",
    "packages/rust/pirtm-tensor",
    "packages/rust/pirtm-rs",
    "packages/rust/brauer",
    "packages/rust/phase-mirror-agent",
    "packages/rust/wordlove-ffi",
    "packages/rust/multiplicity/multiplicity-core",
    "packages/rust/ramanujan-multiplicity",
    "packages/rust/kani_harnesses",
    "packages/rust/certificate-runtime",
    "packages/rust/alpha-rs",
    "packages/rust/al-gft-derive",
    "packages/rust/language-mapping",
    "packages/rust/archivum",
    "packages/rust/crmf",
    "packages/rust/ace",
]
exclude = [
    "packages/resonance",
        "packages/rust/pirtm-core",
    "packages/rust/pirtm-tensor",
    "packages/rust/pirtm-rs",

]

[workspace.package]
# Published identity: Universal Closure Calculator (UCC).
# Provenance is preserved in `repository`/`homepage` (PhaseMirror/Prime).
description = "Universal Closure Calculator — Multiplicity/Foundry research monorepo"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Ryan O. Van Gelder", "UOR Foundation"]
license = "Prime Materia Open Commons and Bound Works License v1.0"
repository = "https://github.com/PhaseMirror/Prime"
homepage = "https://github.com/PhaseMirror/Prime"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
hex = "0.4"
thiserror = "1.0"
num-bigint = { version = "0.4", features = ["serde"] }
num-integer = "0.1"
num-traits = "0.2"
uint = "0.9"
rayon = "1.8"
bytemuck = "1.14"
anyhow = "1.0"
nalgebra = "0.32"
argmin = "0.6"
goldilocks = { path = "crates/goldilocks" }
tracing = "0.1"
chrono = "0.4"
schemars = "0.8"
uuid = { version = "1.3", features = ["v4", "serde"] }
sha2 = "0.10"
lean-rs = "0.4"
lean-rs-host = "0.4"
lean-toolchain = "0.4"
openssl = { version = "0.10", features = ["vendored"] }
