[workspace]

[package]
name = "automorphic-core"
version = "0.1.0"
edition = "2021"
authors = ["PhaseMirror"]
license = "MIT"
description = "Ξ∞/CSL Automorphic Learning: prime-structured inductive bias, spectral diagnostics, and projection-first safety"

[dependencies]
nalgebra = "0.33"
num-integer = "0.1"
num-prime = "0.4"
num-complex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2"
rand = "0.8"
rand_chacha = "0.3"

[dev-dependencies]
kani = "0.0.0"
proptest = { version = "1.4", features = ["std"] }
approx = "0.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
