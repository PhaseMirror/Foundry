[package]
name = "langlands-prism-rust"
version = "0.1.0"
edition = "2021"
authors = ["Ryan O. Van Gelder <ryan@citizengardens.org>"]
description = "Production-grade execution and verification engine for the Langlands Prism recursive cognitive framework"

[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"

[[bin]]
name = "langlands-prism-cli"
path = "src/bin/main.rs"

[lib]
name = "langlands_prism_rust"
path = "src/lib.rs"
