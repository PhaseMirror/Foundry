[package]
name = "lorenz-attractor-rust"
version = "0.1.0"
edition = "2021"
authors = ["Ryan O. Van Gelder <ryan@citizengardens.org>"]
description = "Production-grade execution and verification engine for the Multiplicity-Enhanced Lorenz Attractor"

[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"

[[bin]]
name = "lorenz-attractor-cli"
path = "src/bin/main.rs"

[lib]
name = "lorenz_attractor_rust"
path = "src/lib.rs"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(kani)'] }

