[package]
name = "mcpe"
version = "0.1.0"
edition = "2021"
authors = ["PRIME Lab <prime@umoncton.ca>"]
description = "Production-grade formal verification framework for perception, robotics and intelligent machines protocols"
license = "MIT"
repository = "https://github.com/prime-ai/MCPE"
readme = "README.md"
keywords = ["formal-verification", "kani", "robotics", "protocols", "bit-precision"]
categories = ["science", "development-tools"]

[workspace]

[dependencies]
kani = { package = "kani-verifier", version = "0.67.0", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
thiserror = { version = "2.0", optional = true }

[features]
default = ["std"]
std = ["serde", "thiserror"]
kani = ["dep:kani", "std"]

[lib]
name = "mcpe"
path = "src/lib.rs"

[[bin]]
name = "mcpe-cli"
path = "src/bin/main.rs"

[[test]]
name = "mcpe-tests"
path = "tests/integration.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.test]
opt-level = 1
debug = true

[lints.rust]
unsafe_code = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
