[package]
name = "mersenne_503"
version = "0.1.0"
edition = "2021"
authors = ["Multiplicative Research Program <research@multiplicity.org>"]
description = "Formal verification framework for Mersenne-503: Leech-coded expanders, emergent AdS geometry, and Bayesian crystallization"
license = "MIT"
repository = "https://github.com/multiplicity-ai/MERSENNE_503"
readme = "README.md"
keywords = ["mersenne", "formal-verification", "kani", "cryptography", "tensor", "leech-lattice"]
categories = ["science", "development-tools", "cryptography"]

[workspace]

[dependencies]
kani = { package = "kani-verifier", version = "0.67.0", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
thiserror = { version = "2.0", optional = true }
rand = { version = "0.8", optional = true }

[features]
default = ["std"]
std = ["serde", "thiserror", "rand"]
kani = ["dep:kani", "std"]

[lib]
name = "mersenne_503"
path = "src/lib.rs"

[[bin]]
name = "m503"
path = "src/bin/main.rs"

[[test]]
name = "m503-tests"
path = "tests/integration.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.test]
opt-level = 1
debug = true

[lints.rust]
unsafe_code = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
