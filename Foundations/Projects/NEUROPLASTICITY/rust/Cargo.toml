[package]
name = "neuroplasticity"
version = "0.1.0"
edition = "2021"
authors = ["Multiplicity / Citizen Gardens"]
description = "Production reference implementation of Neuroplasticity, PIRTM, and CSL"

[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_distr = "0.4"

[[bin]]
name = "neuroplasticity_daemon"
path = "src/main.rs"

[lib]
name = "neuroplasticity"
path = "src/lib.rs"
