[package]
name = "personalized_medicine"
version = "0.1.0"
edition = "2021"
authors = ["Multiplicity / Ryan Van Gelder"]
description = "Production reference engine for ADR-0037: Toy Contractivity, BN254 Pedersen Commitment, and Runtime Monitor"

[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
sha2 = "0.10"
hex = "0.4"

[[bin]]
name = "pm_daemon"
path = "src/main.rs"

[lib]
name = "personalized_medicine"
path = "src/lib.rs"
