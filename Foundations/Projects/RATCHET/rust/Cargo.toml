[package]
name = "ratchet"
version = "0.1.0"
edition = "2021"
authors = ["Multiplicity / Citizen Gardens"]
description = "Production reference implementation of ADR-0038: The Intelligence Ratchet"

[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

[[bin]]
name = "ratchet_daemon"
path = "src/main.rs"

[[bin]]
name = "test_harness"
path = "src/bin/test_harness.rs"

[lib]
name = "ratchet"
path = "src/lib.rs"
