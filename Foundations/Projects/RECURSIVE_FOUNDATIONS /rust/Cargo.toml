[package]
name = "recursive-foundations"
version = "0.1.0"
edition = "2021"
authors = ["Multiplicative Research Program <research@multiplicity.org>"]
description = "Production-grade formal verification framework for recursive foundations: fixed points, induction, coinduction, and well-founded recursion"
license = "MIT"
repository = "https://github.com/multiplicity-ai/RECURSIVE_FOUNDATIONS"
readme = "README.md"
keywords = ["recursive", "fixed-point", "induction", "coinduction", "formal-verification", "kani"]
categories = ["science", "development-tools", "mathematics"]

[workspace]

[dependencies]
kani = { package = "kani-verifier", version = "0.67.0", optional = true }
thiserror = { version = "2.0", optional = true }

[features]
default = ["std"]
std = ["thiserror"]
kani = ["dep:kani", "std"]

[lib]
name = "recursive_foundations"
path = "src/lib.rs"

[[test]]
name = "rf-tests"
path = "tests/integration.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.test]
opt-level = 1
debug = true

[lints.rust]
unsafe_code = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
