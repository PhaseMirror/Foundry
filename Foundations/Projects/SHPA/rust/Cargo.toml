[package]
name = "shpa"
version = "0.1.0"
edition = "2021"
authors = ["Citizen Gardens / The Foundation of Multiplicity"]
description = "Production reference engine for Stateless Hash-to-Prime Attestation (SHPA)"

[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

[[bin]]
name = "shpa_daemon"
path = "src/main.rs"

[lib]
name = "shpa"
path = "src/lib.rs"
