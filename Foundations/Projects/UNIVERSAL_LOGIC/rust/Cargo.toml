[package]
name = "universal_logic"
version = "0.1.0"
edition = "2021"
authors = ["Ryan O. Van Gelder / The Foundation of Multiplicity"]
description = "Universal Logic (v2.1+): Typed, Contractively Certified Framework for Multi-Logic Reasoning"

[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-traits = "0.2"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

[[bin]]
name = "ul_daemon"
path = "src/main.rs"

[lib]
name = "universal_logic"
path = "src/lib.rs"
