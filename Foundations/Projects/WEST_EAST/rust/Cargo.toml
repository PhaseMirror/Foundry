[package]
name = "west_east"
version = "0.1.0"
edition = "2021"
authors = ["Multiplicity Research Program (MRP)"]
description = "PIRTM/DRMM 2.0: A Constitutional Bridge between Western and Eastern Mathematics"

[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-complex = "0.4"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

[[bin]]
name = "we_daemon"
path = "src/main.rs"

[lib]
name = "west_east"
path = "src/lib.rs"
