[package]
name = "zetacell"
version = "0.1.0"
edition = "2021"
authors = ["The Foundation of Multiplicity"]
description = "ZetaCell: Finite-Dimensional Coupling of Prime Channels to Zeta-Zero Spectral Witnesses"

[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

[[bin]]
name = "zeta_daemon"
path = "src/main.rs"

[lib]
name = "zetacell"
path = "src/lib.rs"
