[package]
name = "Policy"
version = "0.1.0"
description = "Formal Architecture Decision Records for Multiplicity Policy Governance"
lean_version = "leanprover/lean4:v4.33.0"

[dependencies]
# NOTE: No mathlib dependency — L0-NO-MATHLIB rule. Batteries is optional
# and not required; the model is self-contained in batteries-free Lean 4.

[build]
olean_compression = true
threads = 4