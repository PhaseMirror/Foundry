  max_dimension: 12
  max_rational_denominator_bits: 256
  max_trace_length: 500
  epsilon: "1e-3"

# Cross-language parity
parity:
  lean_module: Core.OFA.OperatorFirstArithmetic
  rust_module: pirtm_engine.ofa
  byte_exact: true
  check_interval: "1h"

# Audit
