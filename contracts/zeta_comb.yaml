  - name: endomorphism_compose
    type: EndomorphismRule
    domain_dim: 12
    lip_constant: "1/10"
    verified: true
    kani_harness: verify_rank_consistent

  - name: rat_interval_mul
    type: RatInterval
    domain_dim: 12
    lip_constant: "1/100"
    verified: true
    kani_harness: verify_coherence_finite_primes

# Boundary conditions
