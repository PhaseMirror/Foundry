[package]
name = "echonomics-engine"
version = "0.1.0"
edition = "2021"
authors = ["Phase Mirror Formal Methods Engineering <ryvngldr@gmail.com>"]
description = "Production Rust + Kani verification engine for Echonomics Social Physics, DUNA Governance, and UOR Geometry"

# Register the `kani` cfg so `cargo`/`rustc` do not warn about it.
# Kani sets `--cfg kani` when compiling `#[kani::proof]` harnesses.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
