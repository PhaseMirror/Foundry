[package]
name = "repo-conformance"
license = "MIT"
description = "The BDD runner and the honesty meta-gate (R2/R3). Dev and CI only; never a dependency of a shipped crate."
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# The workspace's canonical `repo-model` is `crates/model`; the excluded
# `crates/repo-model` is a stale duplicate that must not appear in the graph.
repo-model = { workspace = true }
