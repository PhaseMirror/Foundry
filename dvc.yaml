stages:
  zmt_benchmark:
    cmd: python src/zmt_bridge_kernel_fast.py --max_N ${N} --max_M ${M} --output benchmarks/metrics.json
    params:
    - N
    - M
    deps:
    - src/zmt_bridge_kernel_fast.py
    - data/prime_zeros_small.npz
    - params.yaml
    outs:
    - benchmarks/metrics.json
    metrics:
    - benchmarks/metrics.json:
        cache: false
    plots:
    - notebooks/zmt/zmt_reconstruction_live.html
