name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: lake build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Host toolchain sanity check
        run: |
          echo "=== Host C toolchain pre-build check ==="
          command -v gcc >/dev/null 2>&1 && gcc --version | head -1 || { echo "FAIL: gcc not found"; exit 1; }
          command -v ld >/dev/null 2>&1 && ld --version | head -1 || { echo "FAIL: ld not found"; exit 1; }
          find /lib /usr/lib -name "libc.so.6" 2>/dev/null | head -1 | grep -q . || { echo "FAIL: libc.so.6 not found"; exit 1; }
          find /lib /usr/lib -name "libm.so.6" 2>/dev/null | head -1 | grep -q . || { echo "FAIL: libm.so.6 not found"; exit 1; }
          echo "PASS: gcc, ld, libc.so.6, libm.so.6 present"

      # Installs the toolchain from `lean-toolchain`, resolves the pinned `uor`
      # dependency from `lake-manifest.json`, and runs `lake build`.
      - name: Build Lean library
        uses: leanprover/lean-action@v1
        with:
          build-args: "F1Square"

      # Mechanized-honesty gate: the genuine-proof layer must be axiom-clean —
      # no `sorry` (sorryAx), no `native_decide` (Lean.ofReduceBool), no stray axioms.
      # `#print axioms` is authoritative; see scripts/honesty_audit.sh.
      - name: Mechanized-honesty audit
        run: bash scripts/honesty_audit.sh
