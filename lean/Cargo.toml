[workspace]

[package]
name = "sapgc"
version = "0.1.0"
edition = "2021"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
num-rational = "0.4"
lean-rs = "0.7.2"
ndarray = "0.15.6"

[build-dependencies]
regex = "1"

[dev-dependencies]
kani = "0.0.1"
proptest = "1.5.0"
