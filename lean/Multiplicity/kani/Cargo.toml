[workspace]
resolver = "2"

[package]
name = "multiplicity-kani"
version = "0.1.0"
edition = "2021"
description = "Multiplicity kernel (ADR-0001): Kani harnesses — the executable verification half of the three-form contract"
license = "Apache-2.0"

[dependencies]
multiplicity-core = { path = "../rust/multiplicity-core" }
multiplicity-primes = { path = "../rust/multiplicity-primes" }
multiplicity-algebra = { path = "../rust/multiplicity-algebra" }
multiplicity-rsa = { path = "../rust/multiplicity-rsa" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
