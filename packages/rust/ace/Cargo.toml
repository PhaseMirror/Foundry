[package]
name = "ace"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1.3"
sha2 = "0.10"
hex = "0.4"
archivum = { path = "../archivum" }
crmf = { path = "../crmf" }
anyhow = "1.0"

[dev-dependencies]

[[bin]]
name = "generate_witness"
path = "src/bin/generate_witness.rs"

[[test]]
name = "integration_test"
path = "tests/integration_test.rs"

[[test]]
name = "e2e_integration_test"
path = "tests/e2e_integration_test.rs"
