[package]
name = "adr_rust"
version = "0.2.0"
edition = "2021"
description = "Production-grade ADR-0004 Euclid Multiplicity formal verification (Rust/Kani)"
license = "MIT"
rust-version = "1.70"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
num-prime = "0.4"
itertools = "0.13"

[dev-dependencies]
kani = "0.67"
proptest = { version = "1.4", features = ["std"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
