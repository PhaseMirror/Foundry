[package]
name = "al-gft-derive"
version = "0.1.0"
edition = "2021"
authors = ["PhaseMirror"]
license = "MIT"
description = "Schwinger-Keldysh derivation engine for the Gaussian AL-GFT with W1 witness emission"
repository = "https://github.com/PhaseMirror/Prime"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.3", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "al-gft-pipeline"
path = "src/bin/pipeline.rs"
