[package]
name = "archivum-scripts"
version = "0.1.0"
edition = "2021"
description = "Rust port of packages/rust/archivum/scripts — CBOR test-vector generation and the 1000-run determinism validation driver"
license = "Prime Materia Open Commons and Bound Works License v1.0"
repository = "https://github.com/PhaseMirror/Prime"

[lib]
name = "archivum_scripts"
path = "src/lib.rs"

[[bin]]
name = "generate-vectors"
path = "src/bin/generate_vectors.rs"

[[bin]]
name = "validate-determinism"
path = "src/bin/validate_determinism.rs"

[[bin]]
name = "determinism-dummy"
path = "src/bin/determinism_dummy.rs"

[dependencies]
ciborium = "0.2.2"
blake3 = "1.5"
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"