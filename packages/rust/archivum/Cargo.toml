[package]
name = "archivum"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha3 = "0.10"
thiserror = "1.0"
blake3 = "1.3"
num-bigint = { version = "0.4", features = ["serde"] }
num-integer = "0.1"
num-traits = "0.2"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"

[dev-dependencies]
thiserror = "1.0"

[[test]]
name = "integration_test"
path = "tests/integration_test.rs"
