[package]
name = "atomic-simulator"
version = "0.1.0"
edition = "2021"
description = "Rust port of packages/rust/atomic-calculator — CivicSimulator, stability benchmark, and stress-test scenarios"
license = "Prime Materia Open Commons and Bound Works License v1.0"
repository = "https://github.com/PhaseMirror/Prime"

[lib]
name = "atomic_simulator"
path = "src/lib.rs"

[[bin]]
name = "stability-benchmark"
path = "src/bin/stability_benchmark.rs"

[[bin]]
name = "stress-test"
path = "src/bin/stress_test.rs"