[package]
name = "binary-fragmentation"
version = "0.1.0"
edition = "2021"
description = "Rust port of Foundry/Foundations/Projects/BINARY — multidimensional state, encoders/decoders, lossy fragmentation operators, and information-loss metrics"
license = "Prime Materia Open Commons and Bound Works License v1.0"
repository = "https://github.com/PhaseMirror/Prime"

[lib]
name = "binary_fragmentation"
path = "src/lib.rs"

[[bin]]
name = "binary-fragmentor"
path = "src/bin/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"