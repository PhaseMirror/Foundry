[package]
name = "circuits"
version = "0.1.0"
edition = "2021"
description = "Rust port of Foundry/circuits tooling — circom component parsing, ZK constraint-budget decision model, and the ACE constraint report generator"
license = "Prime Materia Open Commons and Bound Works License v1.0"
repository = "https://github.com/PhaseMirror/Prime"

[lib]
name = "circuits"
path = "src/lib.rs"

[[bin]]
name = "generate-constraint-report"
path = "src/bin/generate_constraint_report.rs"

[[bin]]
name = "budget-check"
path = "src/bin/budget_check.rs"

[dependencies]
serde_json = { workspace = true }
regex = "1.12"

[dev-dependencies]
tempfile = "3"