[package]
name = "commander-cli"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
sigma = { path = "../sigma" }
archivum = { path = "../archivum" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
tokio = { version = "1.35", features = ["full"] }
ratatui = "0.26"
crossterm = "0.27"
