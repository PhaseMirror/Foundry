[package]
name = "core-transpiler"
version = "0.1.0"
edition = "2021"
description = "Rust port of core/scripts/nl_to_pirtm.py — PIRTM Ring 0.5 ISA transpiler (natural language -> MLIR dialect + dual-hash witness)"
license = "Prime Materia Open Commons and Bound Works License v1.0"
repository = "https://github.com/PhaseMirror/Prime"

[lib]
name = "core_transpiler"
path = "src/lib.rs"

[[bin]]
name = "nl-to-pirtm"
path = "src/bin/nl_to_pirtm.rs"

[dependencies]
regex = "1"
blake3 = "1.5"
sha2 = "0.10"
hex = { workspace = true }
pyjson = { path = "../pyjson" }
serde_json = { workspace = true }

[dev-dependencies]