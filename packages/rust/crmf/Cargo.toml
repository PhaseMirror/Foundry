[package]
name = "crmf"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha3 = "0.10"
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
archivum = { path = "../archivum" }
hex = "0.4"
rand = "0.8"

[[test]]
name = "integration_test"
path = "tests/integration_test.rs"
