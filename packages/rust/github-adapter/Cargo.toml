[package]
name = "github-adapter"
description = "Rust port of the GitHub governance adapter (materia_commons/agents/github_adapter)"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
axum = { version = "0.7.9", features = ["json"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time"] }
hmac = { version = "0.12.1", features = ["reset", "std"] }
reqwest = { version = "0.11.27", features = ["json"] }
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
sha2.workspace = true
anyhow.workspace = true
tracing.workspace = true
thiserror.workspace = true
chrono = { workspace = true, features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }