[package]
name = "living-loop"
version = "0.1.0"
edition = "2021"
authors = ["PhaseMirror"]
license = "MIT"
description = "End-to-end Phase Mirror loop: Signature → SpectralGovernor → EmissionGate → Audit → Refuse"

[dependencies]
pirtm-core = { path = "../core" }
adr-verifier = { path = "../adr-verifier" }
nalgebra = { version = "0.33", features = ["serde-serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
anyhow = "1"

[dev-dependencies]
serde_json = "1.0"
kani = "0.67"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
