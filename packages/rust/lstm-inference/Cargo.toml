[package]
name = "lstm-inference"
version = "0.1.0"
edition = "2021"

[dependencies]
async-nats = "0.33"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
ort = "2.0.0-rc.12"
ndarray = "0.15"
chrono = "0.4"
env_logger = "0.10"
config = "0.13"            # for TOML configuration
