[package]
name = "mcp-policy-proxy"
description = "Rust port of the SAT-verified MCP policy proxies (materia_commons/mcp_server/python_proxy.py, github_adapter.py)"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
pyjson = { path = "../pyjson" }
ed25519-dalek = "2"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "io-util", "io-std", "net", "process", "sync", "time"] }

[dev-dependencies]
ed25519-dalek = "2"