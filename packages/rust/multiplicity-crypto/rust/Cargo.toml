[package]
name = "multiplicity-crypto"
version = "1.0.1"
edition = "2021"
rust-version = "1.89"
description = "Multiplicity-crypto: production-grade cryptographic primitives for the PhaseMirror governance manifold — prime-indexed domain separation, multiplicity profiles, HKDF-SHA256, ChaCha20-HMAC SHA-256 AEAD, Merkle trees, contractivity feedback gates, and the QKD hybrid-encryption pipeline (ADR-0066, QKD Hybrid Encryption v1.0.1)."
license = "MIT"
authors = ["PhaseMirror / UOR Foundation"]
repository = "https://github.com/PhaseMirror/Prime"
homepage = "https://github.com/PhaseMirror/Prime"

[workspace]

[dependencies]
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
bcs = "0.1.6"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
zeroize = "1.8"
serde-big-array = "0.5"

[dev-dependencies]
proptest = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
