[package]
name = "multiplicity-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "multiplicity_core"
path = "src/lib.rs"

[[bin]]
name = "semantics_kani_test"
path = "src/main.rs"

[dependencies]
proptest = "1.4"
anyhow = "1.0"
num-complex = "0.4"
rand = "0.8"
kani-verifier = "0.67"
sha2 = "0.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
