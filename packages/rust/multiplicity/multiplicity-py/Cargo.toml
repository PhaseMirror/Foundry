[package]
name = "multiplicity-py"
version = "0.1.0"
edition = "2021"
description = "Rust port of the `multiplicity` Python interop package (core math, crypto fallback bridge, CAS registry, MBC commitment prototype)"
license = "Prime Materia Open Commons and Bound Works License v1.0"
repository = "https://github.com/PhaseMirror/Prime"

[lib]
name = "multiplicity_py"
path = "src/lib.rs"

[dependencies]
pyjson = { path = "../../pyjson" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
hex = { workspace = true }
thiserror = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]