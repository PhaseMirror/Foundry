[package]
name = "observ"
version = "0.1.0"
edition = "2021"
description = "Observability calculus kernel — ADRs 0022–0028: exact measurement-map geometry, null filtration, witness duality, obstruction dimension, reversal-space coding, and the six-component claim gate"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PhaseMirror/UOR"
homepage = "https://github.com/PhaseMirror/UOR"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
thiserror = "1.0"
crmf = { path = "../crmf" }

[[test]]
name = "integration_test"
path = "tests/integration_test.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }