[package]
name = "phase-mirror-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
once_cell = "1.19"
language-mapping = { path = "../language-mapping" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
