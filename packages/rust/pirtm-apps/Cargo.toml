[workspace]
resolver = "2"

[package]
name = "pirtm-apps"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Phase Mirror Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Multiplicity-Foundation/phase-mirror"
homepage = "https://phase-mirror.ai"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

[dependencies]
pirtm-stdlib = { path = "../pirtm-stdlib" }
pirtm-registry = { path = "../pirtm-registry" }
pirtm-dist = { path = "../pirtm-dist" }
pirtm-invariants = { path = "../pirtm-invariants" }
sha2 = "0.10"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio.workspace = true
async-trait.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core"] }
rand.workspace = true
