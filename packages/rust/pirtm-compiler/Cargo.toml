[package]
name = "pirtm-compiler"
version = "1.0.0-alpha"
edition = "2021"
description = "PIRTM compiler with governance and Lean verification"

[[bin]]
name = "pirtm"
path = "src/main.rs"

[dependencies]
pirtm-engine = { path = "../pirtm-engine" }
clap = { version = "4.4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
pirtm-parser = { path = "../pirtm-parser" }
pirtm-kernel-lexer = { path = "../pirtm-kernel-lexer" }
pirtm-mlir = { path = "../pirtm-mlir" }
pirtm-mcp = { path = "../pirtm-mcp" }

telemetry-recorder = { path = "../telemetry-recorder" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
num-rational = "0.4"

[dev-dependencies]
pirtm-monitor = { path = "../pirtm-monitor" }
tempfile = "3"
scopeguard = "1.2"



