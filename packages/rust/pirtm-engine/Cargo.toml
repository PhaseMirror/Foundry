[package]
name = "pirtm-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "PIRTM Arithmetic Control Engine (ACE) per ADR-0066: prime-indexed tensor governance, spectral-radius contractivity veto gate, canonical BCS CRMF envelopes, Ensemble manifests, and the Phase D dual-signature recovery protocol."
license = "Prime Materia Open Commons and Bound Works License v1.0"
authors = ["UOR Foundation"]
repository = "https://github.com/PhaseMirror/Prime"
homepage = "https://github.com/PhaseMirror/Prime"
readme = "README.md"

# Standalone workspace: this crate is intentionally kept out of the monorepo
# workspace so that Kani bounded-model-checking runs in isolation and the
# governance gates never drag in unrelated workspace members.
[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde-big-array = "0.5"
bcs = "0.1.6"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
thiserror = "1.0"

[dev-dependencies]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }