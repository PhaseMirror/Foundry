[package]
name = "pirtm-mcp"
version = "0.1.0"
edition = "2021"
description = "Model Context Protocol (MCP) server for the PIRTM/MOC formal compiler"

[dependencies]
pirtm-engine = { path = "../pirtm-engine" }
pirtm-parser = { path = "../pirtm-parser" }
pirtm-mlir = { path = "../pirtm-mlir" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tempfile = "3"
clap = { version = "4.4", features = ["derive"] }
