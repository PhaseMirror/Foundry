[package]
name = "pirtm-telemetry"
version = "0.1.0"
edition = "2021"
description = "Edge hardware sensor ingestion and Genius v2 R(t) resonance calculator for Citizen Gardens"

[workspace]

[dependencies]
num-rational = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
anyhow = "1.0"
chrono = "0.4"
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
url = "2.5"
