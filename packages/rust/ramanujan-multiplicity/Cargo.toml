[package]
name = "ramanujan-multiplicity"
version = "0.1.0"
edition = "2021"
description = "Ramanujan Multiplicity Project (ADR-233): Rust/Kani-verified number theory — HCN, divisor function, multiplicity profiles, entropy, τ-function, partitions"
license = "Apache-2.0"

[lib]
name = "ramanujan_multiplicity"
path = "src/lib.rs"

[dependencies]
kani-verifier = { version = "0.67", optional = true }

[features]
default = []
kani = ["kani-verifier"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
