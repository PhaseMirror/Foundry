[package]
name = "resolvent-verify"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "resolvent_verify"
path = "src/main.rs"

[[bin]]
name = "resolvent_scan"
path = "src/bin/resolvent_scan.rs"

[features]
default = []
# Enable this feature to use the Lean-certified basis_factors.json
lean_certified = []

# For development, you can also have a feature to use the mock data
mock_basis = []

[dependencies]
clap = { version = "4.0", features = ["derive"] }
