[package]
name = "ucc"
version = "0.1.0"
edition = "2021"
description = "Universal Closure Calculator — ADR-0014 closure kernel, L0 lawfulness gate, canonical receipts, and Q0 CLI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PhaseMirror/UOR"
homepage = "https://github.com/PhaseMirror/UOR"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
crmf = { path = "../crmf" }

[[test]]
name = "integration_test"
path = "tests/integration_test.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }