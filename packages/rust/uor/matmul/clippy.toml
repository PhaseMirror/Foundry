# R7: no heap. The disallowed-types gate is belt-and-braces on top of the
# absence of an `alloc` dependency in every shipped crate.
disallowed-types = [
    { path = "std::vec::Vec", reason = "R7: no heap in any shipped crate" },
    { path = "std::boxed::Box", reason = "R7: no heap in any shipped crate" },
    { path = "std::string::String", reason = "R7: no heap in any shipped crate" },
    { path = "std::collections::HashMap", reason = "R7: no heap in any shipped crate" },
]

# R2/R13: the integer path never converts to or from a float.
disallowed-methods = [
    { path = "f32::mul_add", reason = "R13: the library never adds two floats" },
    { path = "f64::mul_add", reason = "R13: the library never adds two floats" },
]

msrv = "1.89"
