[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "Unicode-3.0", "BSD-2-Clause", "BSD-3-Clause", "Zlib", "ISC"]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

# R11: oracle crates are dev-dependencies of uor-matmul-validate only. The
# shipped crates depend on none of them.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
