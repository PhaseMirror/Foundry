[package]
name = "uor-matmul-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
uor-matmul = { path = "../crates/uor-matmul" }
uor-matmul-core = { path = "../crates/uor-matmul-core" }
uor-matmul-codec = { path = "../crates/uor-matmul-codec" }
uor-matmul-gemm = { path = "../crates/uor-matmul-gemm" }

[[bin]]
name = "totality"
path = "fuzz_targets/totality.rs"
test = false
doc = false

[[bin]]
name = "float_decode"
path = "fuzz_targets/float_decode.rs"
test = false
doc = false

[[bin]]
name = "codec_shapes"
path = "fuzz_targets/codec_shapes.rs"
test = false
doc = false

[workspace]
