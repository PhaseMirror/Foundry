# model/ledger.toml --- the honesty ledger for claims that are not conformance
# IDs (R4).
#
# The conformance IDs and their levels live in `model/ids.toml`, which is the
# register §2.1 defines; duplicating them here would give a constant two
# sources, which is exactly what R10 forbids. What remains is the two kinds of
# claim that have no ID: the identities this repository *reproduces* from an
# authority, and the quantities it *measures* and never asserts.
#
# The meta-gate proves the suite never asserts an `open` claim as established,
# and `CM-03` proves every `some-true` row cites an authority that exists.

spec = "uor-matmul/1"

# ==========================================================================
# Cited identities. Reproduced from an authority, never established here. A
# test may *exercise* one of these; no test may claim to have proved one.
# ==========================================================================

[[claim]]
id = "AUTH-CL-MM01"
level = "some-true"
authority = "CL-MM01"
statement = "the accumulation does not depend on the codec"

[[claim]]
id = "AUTH-CL-MM02"
level = "some-true"
authority = "CL-MM02"
statement = "a scalar codec is the block codec of its singletons"

[[claim]]
id = "AUTH-CL-MM03"
level = "some-true"
authority = "CL-MM03"
statement = "the composite of two codecs is a codec with the composed decode"

[[claim]]
id = "AUTH-CL-MM04"
level = "some-true"
authority = "CL-MM04"
statement = "all bound theorems hold for arbitrary (B, cap); W8A8 is one instantiation"

[[claim]]
id = "AUTH-IEEE754"
level = "some-true"
authority = "IEEE-754-2019"
statement = """a finite IEEE 754 value names an exact dyadic rational; NaN and
infinity propagate by clause 6."""

[[claim]]
id = "AUTH-RING-HOM"
level = "some-true"
authority = "RING-HOM-2W"
statement = """reduction modulo 2^w is a ring homomorphism, so reducing the exact
sum once at the end equals reducing at every step. This is why the integer
oracles agree byte for byte with no exempted region (§3.4)."""

[[claim]]
id = "AUTH-VNNI"
level = "some-true"
authority = "INTEL-VNNI"
statement = """vpdpbusd multiplies unsigned bytes by signed bytes and accumulates
into i32; vpdpwssd multiplies signed words."""

[[claim]]
id = "AUTH-UOR-ADDR"
level = "some-true"
authority = "UOR-ADDR-1"
statement = "JCS-RFC8785 + NFC then SHA-256 over the canonical manifest"

# ==========================================================================
# Open, and stated as open. Nothing below is asserted anywhere in the repo.
# ==========================================================================

[[claim]]
id = "OPEN-CODEBOOK-QUALITY"
level = "open"
statement = """the reconstruction quality of any codebook, including E8, is
measured per (model, codebook) and reported, never asserted (N3)."""

[[claim]]
id = "OPEN-ORACLE-ULPS"
level = "open"
statement = """each classical float oracle's rounding error against the exact
value this library holds, in ulps. Reported by CX-05 through CX-09."""

[[claim]]
id = "OPEN-RESIDENCY"
level = "open"
statement = """the residency collapse of the coded tiers, measured as a scaling
constant against the oracle (CG-03), never asserted."""
