name: Bootstrap honesty gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca
        with:
          push: never
          runCmd: just vv
