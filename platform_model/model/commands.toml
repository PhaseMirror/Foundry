spec = "prismpm/command-contract/1"

[[command]]
name = "backup"
mutates = "local-backup-state"
requires_digest = true
result_schema = "prismpm/backup-snapshot/1"

[[command]]
name = "authority"
mutates = "resolve-and-fetch-only"
requires_digest = false
result_schema = "prismpm/authority-result/1"

[[command]]
name = "build"
mutates = "local-content-store"
requires_digest = false
result_schema = "prismpm/product-release-result/1"

[[command]]
name = "check"
mutates = "never"
requires_digest = false
result_schema = "prismpm/check-result/1"

[[command]]
name = "clean"
mutates = "owned-local-state"
requires_digest = false
result_schema = "prismpm/clean-result/1"

[[command]]
name = "completion"
mutates = "never"
requires_digest = false
result_schema = "prismpm/completion-result/1"

[[command]]
name = "conformance"
mutates = "local-evidence"
requires_digest = true
result_schema = "prismpm/conformance-result/1"

[[command]]
name = "deploy"
mutates = "authorized-target"
requires_digest = true
result_schema = "prismpm/deployment-evidence/1"

[[command]]
name = "destroy"
mutates = "authorized-target-destructive"
requires_digest = true
result_schema = "prismpm/deployment-evidence/1"

[[command]]
name = "fetch"
mutates = "immutable-cache"
requires_digest = false
result_schema = "prismpm/fetch-result/1"

[[command]]
name = "finalize-contract"
mutates = "authorized-target-data-contract"
requires_digest = true
result_schema = "prismpm/deployment-evidence/1"

[[command]]
name = "inspect"
mutates = "never"
requires_digest = true
result_schema = "prismpm/inspect-result/1"

[[command]]
name = "lock"
mutates = "never"
requires_digest = false
result_schema = "prismpm/sdk-lock-update/1"

[[command]]
name = "plan"
mutates = "local-evidence"
requires_digest = true
result_schema = "prismpm/deployment-plan/1"

[[command]]
name = "prepare-promotion"
mutates = "owned-local-policy"
requires_digest = true
result_schema = "prismpm/promotion-policy/1"

[[command]]
name = "promote"
mutates = "signed-local-evidence"
requires_digest = true
result_schema = "prismpm/promotion-result/1"

[[command]]
name = "pull"
mutates = "immutable-cache"
requires_digest = true
result_schema = "prismpm/pull-result/1"

[[command]]
name = "push"
mutates = "registry-content"
requires_digest = true
result_schema = "prismpm/push-result/1"

[[command]]
name = "rollback"
mutates = "authorized-target"
requires_digest = true
result_schema = "prismpm/deployment-evidence/1"

[[command]]
name = "restore"
mutates = "authorized-clean-target"
requires_digest = true
result_schema = "prismpm/restore-result/1"

[[command]]
name = "run"
mutates = "ephemeral-runtime"
requires_digest = true
result_schema = "prismpm/run-result/1"

[[command]]
name = "sign"
mutates = "signed-local-evidence"
requires_digest = true
result_schema = "prismpm/signature-result/1"

[[command]]
name = "sign-evidence"
mutates = "signed-local-evidence"
requires_digest = true
result_schema = "prismpm/evidence-signature-result/1"

[[command]]
name = "status"
mutates = "never"
requires_digest = true
result_schema = "prismpm/deployment-state/1"

[[command]]
name = "template"
mutates = "explicit-update-only"
requires_digest = false
result_schema = "prismpm/template-result/1"

[[command]]
name = "verify"
mutates = "local-evidence"
requires_digest = false
result_schema = "prismpm/verify-result/1"

[[command]]
name = "verify-release"
mutates = "never"
requires_digest = true
result_schema = "prismpm/signature-closure-result/1"

[[command]]
name = "verify-signature"
mutates = "verified-local-evidence"
requires_digest = true
result_schema = "prismpm/signature-result/1"
