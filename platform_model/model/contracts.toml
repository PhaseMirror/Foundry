spec = "prismpm/contracts/1"

# Every public JSON contract is canonical UTF-8 JSON: no BOM, no insignificant
# whitespace, object keys sorted by UTF-8 bytes, shortest canonical integers,
# arrays in their schema-declared semantic order, and exactly one final LF only
# in CLI framing (the content identity excludes that framing LF).

[[contract]]
schema = "prismpm/system-model/1"
path = "schemas/system-model.schema.json"
media_type = "application/vnd.prismpm.system-model.v1+json"
identity = "sha256-canonical-json"
maximum_bytes = 16777216
maximum_items = 65536
extension_policy = "closed"
compatibility = "exact-major-additive-minor"

