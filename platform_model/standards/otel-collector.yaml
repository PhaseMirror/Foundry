receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  attributes/redact:
    actions:
      - action: delete
        key: authorization
      - action: delete
        key: client_label
      - action: delete
        key: history
      - action: delete
        key: left
      - action: delete
        key: right
      - action: delete
        key: secret
      - action: delete
        key: token
  batch: {}
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
exporters:
  debug:
    verbosity: basic
service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [debug]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [debug]
