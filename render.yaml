# Render.com deployment manifest for the Universal Closure Calculator API.
# Build context is the repository root, so the Dockerfile uses repo-root
# relative paths (e.g. scripts/api/...).
services:
  - type: web
    name: universal-closure-calculator
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
